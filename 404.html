<!doctype html><html lang="en" data-language="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#080a17"><title>QBINAURAL — Page Not Found</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#27204a 0%,#0b1023 50%,#070912 100%);color:#f4f2ff;font:16px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header,footer{padding:26px max(6vw,24px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1c}.brand{color:white;text-decoration:none;font-weight:750;letter-spacing:.12em}.switch{display:flex;gap:10px}button{border:1px solid #ffffff44;border-radius:22px;background:transparent;color:white;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#d8caff;color:#151020}main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:70px 20px}h1{font-size:clamp(70px,14vw,160px);line-height:1;margin:0;background:linear-gradient(120deg,#fff,#b49aff);color:transparent;background-clip:text}p{color:#d2cfe1}a.return{display:inline-block;margin-top:18px;padding:12px 22px;border:1px solid #a28aff;border-radius:30px;color:white;text-decoration:none}footer{text-align:center;color:#b8b5c9;border-top:1px solid #ffffff1c}</style></head><body><header><a class="brand" href="/">QBINAURAL</a><div class="switch"><button type="button" data-set="pl">PL</button><button type="button" data-set="en">EN</button></div></header><main><h1>404</h1><p id="message">Page not found.</p><a class="return" id="back" href="/">Return to QBINAURAL</a></main><footer>© 2026 QBINAURAL</footer><script>(function(){const r=document.documentElement;function set(l){l=l==='pl'?'pl':'en';r.lang=l;r.dataset.language=l;document.title=l==='pl'?'QBINAURAL — Nie znaleziono strony':'QBINAURAL — Page Not Found';document.getElementById('message').textContent=l==='pl'?'Nie znaleziono strony.':'Page not found.';document.getElementById('back').textContent=l==='pl'?'Wróć do QBINAURAL':'Return to QBINAURAL';document.querySelectorAll('[data-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.set===l)));try{localStorage.setItem('qb-language',l)}catch(e){}}let l=new URLSearchParams(location.search).get('lang');if(!['pl','en'].includes(l)){try{l=localStorage.getItem('qb-language')}catch(e){}}if(!['pl','en'].includes(l))l=(navigator.language||'en').toLowerCase().startsWith('pl')?'pl':'en';set(l);document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.set)))})();</script></body></html>
